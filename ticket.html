<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NACWS · Your Event Ticket</title>
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://script.google.com https://script.googleusercontent.com https://*.googleusercontent.com https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com https://api.qrserver.com https://*.qrserver.com https://api.ipify.org; script-src 'self' https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://api.qrserver.com https://*.qrserver.com https://cdnjs.cloudflare.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://*.googleusercontent.com https://api.ipify.org https://api.qrserver.com;">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

<header class="app-header">
    <div class="logo-icon"><img src="nacws-logo.jpg" alt="NACWS Logo" class="logo-img fallback-img" /></div>
    <div class="header-title"><h1>Your Event Ticket</h1><small>NACWS Cybersecurity Seminar 2027</small></div>
</header>

<div id="ticketPageRoot" class="ticket-page-container">
    <p id="ticketLoading" class="ticket-page-status">Loading your ticket…</p>
    <p id="ticketError" class="ticket-page-status ticket-page-error"></p>

    <div id="ticketCardWrap" class="ticket-page-card-wrap">
        <div id="compactTicket" class="ticket compact">
            <div class="ticket-inner">
                <div class="ticket-header-logo">
                    <img src="nacws-logo.png" alt="NACWS Logo" class="ticket-logo-top fallback-img">
                </div>
                <div class="ticket-event-centralized">
                    <h2>NACWS CYBERSECURITY SEMINAR 2027</h2>
                    <div class="ticket-meta-single-line">EVENT PASS</div>
                </div>

                <div class="ticket-body">
                    <div class="ticket-details">
                        <div class="ticket-field">
                            <span class="ticket-label">Rank & Name</span>
                            <span class="ticket-value"><span id="compactRank"></span> <span id="compactName"></span></span>
                        </div>
                        <div class="ticket-field">
                            <span class="ticket-label">Service Number</span>
                            <span class="ticket-value" id="compactSvcNo">—</span>
                        </div>
                        <div class="ticket-field">
                            <span class="ticket-label">Organization / Unit</span>
                            <span class="ticket-value" id="compactOrg">—</span>
                        </div>
                        <div class="ticket-field">
                            <span class="ticket-label">Assigned Role</span>
                            <span class="ticket-value" id="compactRole">—</span>
                        </div>
                        <div class="ticket-field">
                            <span class="ticket-label">Unique Pass ID</span>
                            <span class="ticket-value id-value" id="compactId">—</span>
                        </div>
                    </div>

                    <div class="qr-container-compact">
                        <div id="qrcode-compact"></div>
                        <span class="scan-hint-text">SCAN FOR VERIFICATION</span>
                    </div>
                </div>

                <div class="ticket-meta-single-line ticket-footnote">
                    📅 2 – 6 July 2027 · 📍 NACWS Giri, Abuja
                </div>
            </div>
        </div>

        <div class="ticket-page-actions">
            <button type="button" class="btn btn-primary" id="ticketDownloadBtn" disabled>⬇️ Download Ticket</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"><span id="toastMsg">Message</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
